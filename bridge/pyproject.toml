[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-android-bridge"
version = "0.7.0"
description = "Authenticated local companion for the native Herdr Android client"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3", "anyio>=4,<5", "segno>=1.6,<2", "Pillow>=12.1.1,<13", "websockets>=14,<18"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
herdr-android-bridge = "herdr_bridge.__main__:main"
herdr-pocket = "herdr_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["herdr_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
