name: Host packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
          - runner: macos-14
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # setup-python's macOS 3.11 cache stops at the last installer release.
      # Use the same current, portable runtime on every packaging target.
      - run: python -m pip install uv==0.12.24
      - name: Install the packaged Python runtime
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/herdr-pocket-python
        run: |
          uv python install 3.11.17
          uv venv --python 3.11.17 bridge/.venv
          uv pip install --python bridge/.venv/bin/python -r bridge/requirements.lock -r bridge/requirements-build.lock
          uv pip install --python bridge/.venv/bin/python --no-deps -e ./bridge
      - run: bridge/.venv/bin/python scripts/build_host.py
      - name: Exercise the packaged runtime and pairing
        shell: bash
        run: bridge/.venv/bin/python scripts/smoke_host_package.py artifacts/host/herdr-pocket-${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        id: upload_host
        with:
          name: herdr-pocket-host-${{ matrix.artifact }}
          path: artifacts/host/*
      - name: Keep only the latest herdr-pocket-host-${{ matrix.artifact }} artifact
        if: >-
          ${{ !cancelled() && steps.upload_host.outputs.artifact-id != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: herdr-pocket-host-${{ matrix.artifact }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload_host.outputs.artifact-id }}
        with:
          script: |
            await require('./.github/scripts/keep-latest-artifacts.cjs')({
              github, context, core,
              artifactName: process.env.ARTIFACT_NAME,
              uploadedArtifactId: process.env.UPLOADED_ARTIFACT_ID
            });
